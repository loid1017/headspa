<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>うららか｜カウンセリング</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- プログレスエリア -->
    <div class="progress-area" id="progressArea" style="display:none">
      <div class="progress-info">
        <span class="progress-step" id="progressStep">1 / 8</span>
        <span class="progress-label" id="progressLabel">基本情報</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <div class="leaf-row" id="leafRow"></div>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="main" id="mainContent">

      <!-- スタート画面 -->
      <div class="screen screen-start active" id="screenStart">
        <div class="start-hero">
          <img src="logo.jpg" alt="とまり木 salon うららか" class="start-hero-img">
        </div>
        <div class="start-body">
          <h1 class="start-title">本日もようこそ</h1>
          <p class="start-desc">施術をより心地よくお受けいただくために<br>いくつかお伺いさせてください。</p>
          <p class="start-time">所要時間：約1分</p>
          <button class="btn-primary" id="btnStart">はじめる</button>
        </div>
      </div>

      <!-- 質問画面 -->
      <div class="screen screen-question" id="screenQuestion">
        <div class="question-card" id="questionCard">
          <div class="question-category" id="questionCategory">基本情報</div>
          <h2 class="question-text" id="questionText"></h2>
          <p class="question-sub" id="questionSub"></p>
        </div>
        <div class="choices" id="choices"></div>
        <button class="btn-back" id="btnBack">← 前の質問へ戻る</button>
      </div>

      <!-- サマリー画面 -->
      <div class="screen screen-summary" id="screenSummary">
        <div class="summary-header">
          <div class="summary-icon">
            <svg viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="19" stroke="#74C69D" stroke-width="2"/>
              <path d="M12 20L17 25L28 14" stroke="#2D6A4F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="summary-title">カウンセリング完了</h2>
          <p class="summary-desc">ご回答いただきありがとうございます。<br>スタッフにこの画面をご提示ください。</p>
        </div>
        <div class="summary-body" id="summaryBody"></div>
        <button class="btn-line" id="btnLine">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.03 2 11c0 3.13 1.68 5.9 4.28 7.6-.18.65-.67 2.37-.77 2.74-.12.45.17.44.35.32.15-.1 1.92-1.3 2.7-1.83.44.06.9.09 1.36.09 5.52 0 10-4.03 10-9S17.52 2 12 2z"/></svg>
          LINEで送る
        </button>
        <button class="btn-secondary" id="btnRestart">最初からやり直す</button>
      </div>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
